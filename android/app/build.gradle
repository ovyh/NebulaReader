plugins {
    id 'com.android.application'
}

// 本地或 CI 提供 android/keystore.properties 时启用发布签名
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'io.nebula.reader'
    compileSdk 34

    defaultConfig {
        applicationId 'io.nebula.reader'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 把仓库根目录的 Web 资源合并进 APK 的 assets
    def webAssets = layout.buildDirectory.dir('webassets').get().asFile
    sourceSets {
        main {
            assets.srcDirs += webAssets
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.9.0'
}

def webRoot = rootProject.file('..')

tasks.register('copyWebAssets', Copy) {
    from(webRoot) {
        include 'index.html'
        include 'manifest.webmanifest'
        include 'sw.js'
        include 'css/**'
        include 'js/**'
        include 'data/**'
        include 'assets/**'
    }
    into layout.buildDirectory.dir('webassets')
}

tasks.named('preBuild') {
    dependsOn 'copyWebAssets'
}
